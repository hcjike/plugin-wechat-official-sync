plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'com.hcjike.wechatofficialsync'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    implementation 'org.jsoup:jsoup:1.18.3'
    // 纯 Java 的 webp 解码器：微信素材不支持 webp，需解码后重编码为 png/jpg
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    // SQLite：缓存已上传到微信的图片（文件指纹 → 微信返回的 url / media_id），避免同一资源重复上传
    implementation 'org.xerial:sqlite-jdbc:3.41.2.2'

    testImplementation 'run.halo.app:api'
    // 仅测试用：解析并校验 extensions/settings.yaml（表单由 Halo 在运行时解析，写错不会有编译期报错）
    testImplementation 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

// 用 Sync 而非 Copy：vite 产物文件名带内容 hash，Copy 不会删除上一次的旧文件，
// 会导致旧 JS 残留在 jar 中（体积冗余且容易出现「页面加载旧代码」的迷惑现象）；
// Sync 保证目标目录与 dist 完全一致
tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}
