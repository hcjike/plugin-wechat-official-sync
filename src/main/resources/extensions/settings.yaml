apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-wechat-official-sync-settings
spec:
  forms:
    - group: wechat
      label: 微信公众号
      formSchema:
        - $formkit: text
          name: appId
          label: AppID
          help: 公众平台「设置与开发 - 基本配置」中的开发者 ID
          validation: required
        - $formkit: secret
          name: appSecretName
          label: AppSecret
          descriptionPreset: 微信公众号开发者密码
          requiredKeys:
            - key: appSecret
              help: 公众平台「设置与开发 - 基本配置」中的开发者密码（AppSecret）
          help: 由 Halo Secret 托管，这里只保存 Secret 名称、不保存明文
        - $formkit: text
          name: baseUrl
          label: 代理接口地址
          help: 选填。留空直连微信官方接口；无固定公网 IP 时可填自建反向代理地址（见 README）
          value: ""
        - $formkit: text
          name: author
          label: 默认作者
          help: 同步到公众号的作者名，留空用文章作者。微信上限 8 个字，超长自动截断
          value: ""
        - $formkit: select
          name: commentMode
          id: commentMode
          label: 留言设置
          value: "close"
          options:
            - value: "close"
              label: 关闭留言
            - value: "all"
              label: 所有人可留言
            - value: "fans"
              label: 已关注的人可留言
          help: 草稿的留言权限；「已关注 7 天及以上」需在公众号后台设置
        - $formkit: textarea
          name: imageHostAllowlist
          label: 图片下载白名单
          help: 选填。默认拒绝下载内网、环回地址的图片（防 SSRF）；内网部署时每行填一个域名、IP 或 CIDR 放行，留空最安全
          value: ""
        - $formkit: switch
          onValue: true
          offValue: false
          name: updateExistingDraft
          id: updateExistingDraft
          label: 重复同步更新草稿
          value: true
          help: 开启：再次同步时更新上次写入的那份草稿（已不在则新建）；关闭：每次都新建一份草稿
        - $formkit: number
          name: cacheRetentionDays
          id: cacheRetentionDays
          label: 缓存保留天数
          value: 30
          help: 默认 30 天；留空、0 或负数表示全部保留。每天 0 点自动清理超过保留期且未被使用的缓存
    - group: beautify
      label: 正文美化
      formSchema:
        - $formkit: color
          name: textColor
          label: 正文文字颜色
          help: 段落、列表、表格正文的文字颜色
          value: "#3f3f3f"
          validation: required
        - $formkit: color
          name: linkColor
          label: 链接颜色
          help: 正文中超链接的文字颜色
          value: "#576b95"
          validation: required
        - $formkit: select
          name: attachmentLinkDisplay
          id: attachmentLinkDisplay
          label: 附件链接显示
          value: "address"
          options:
            - value: "address"
              label: 显示链接地址
            - value: "content"
              label: 显示链接内容
          help: pdf、zip 等无法提交到微信的附件链接会显示为纯文本，这里选择显示原始地址还是链接自身的文字
        - $formkit: color
          name: inlineCodeColor
          label: 行内代码颜色
          help: 行内 code 的文字颜色
          value: "#d14"
          validation: required
        - $formkit: color
          name: inlineCodeBgColor
          label: 行内代码底色
          help: 行内 code 的背景色
          value: "#f2f3f5"
          validation: required
        - $formkit: switch
          onValue: true
          offValue: false
          name: blockquoteBorderEnabled
          id: blockquoteBorderEnabled
          label: 引用块显示边框
          value: true
          help: 关闭后引用块不显示左侧边框（颜色见下方「引用块边框颜色」）
        - $formkit: color
          name: themeColor
          label: 引用块边框颜色
          help: 引用块左侧边框的颜色
          value: "#07c160"
          validation: required
        - $formkit: color
          name: blockquoteBgColor
          label: 引用块背景色
          help: 引用块的背景颜色
          value: "#f7f7f7"
          validation: required
        - $formkit: switch
          onValue: true
          offValue: false
          name: headingBorderEnabled
          id: headingBorderEnabled
          label: 标题显示边框
          value: false
          help: 开启后 H2–H6 标题显示左侧边框（H1 不加），颜色由下方各级「标题边框颜色」决定
        - $formkit: color
          name: h1Color
          label: 一级标题颜色
          help: H1 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: select
          name: h1Align
          id: h1Align
          label: 一级标题对齐方式
          value: "center"
          options:
            - value: "left"
              label: 左对齐
            - value: "center"
              label: 居中
            - value: "right"
              label: 右对齐
          help: H1 标题的对齐方式；H1 已自带对齐方式时保持原样、本项不生效
        - $formkit: color
          name: h2Color
          label: 二级标题颜色
          help: H2 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h2BorderColor
          label: 二级标题边框颜色
          help: H2 标题左侧边框颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h3Color
          label: 三级标题颜色
          help: H3 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h3BorderColor
          label: 三级标题边框颜色
          help: H3 标题左侧边框颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h4Color
          label: 四级标题颜色
          help: H4 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h4BorderColor
          label: 四级标题边框颜色
          help: H4 标题左侧边框颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h5Color
          label: 五级标题颜色
          help: H5 标题文字颜色
          value: "#333333"
          validation: required
        - $formkit: color
          name: h5BorderColor
          label: 五级标题边框颜色
          help: H5 标题左侧边框颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h6Color
          label: 六级标题颜色
          help: H6 标题文字颜色
          value: "#888888"
          validation: required
        - $formkit: color
          name: h6BorderColor
          label: 六级标题边框颜色
          help: H6 标题左侧边框颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: detailsTitleBgColor
          label: 折叠块标题背景色
          help: 折叠块（Halo 折叠内容）标题栏的背景色
          value: "#f7f7f7"
          validation: required
        - $formkit: color
          name: detailsContentBgColor
          label: 折叠块内容背景色
          help: 折叠块内容区的背景色
          value: "#ffffff"
          validation: required
        - $formkit: color
          name: detailsBorderColor
          label: 折叠块边框颜色
          help: 折叠块卡片边框与标题栏分隔线的颜色
          value: "#e6e6e6"
          validation: required
        - $formkit: color
          name: mediaCardBgColor
          label: 视频/音频卡片背景色
          help: 微信不支持正文内嵌视频与音乐，这类内容会重建为提示卡片；此项是卡片背景色
          value: "#f7f7f7"
          validation: required
        - $formkit: color
          name: mediaCardTitleColor
          label: 视频/音频卡片主行颜色
          help: 卡片主行「▶ 视频」/「♪ 音频」的文字颜色
          value: "#333333"
          validation: required
        - $formkit: color
          name: mediaCardHintColor
          label: 视频/音频卡片引导语颜色
          help: 卡片引导语「请点击文末『阅读原文』观看/收听」的文字颜色
          value: "#999999"
          validation: required
        - $formkit: color
          name: mediaCardMarkerColor
          label: 视频/音频卡片标记颜色
          help: 卡片标记符号「▶」/「♪」的颜色
          value: "#07c160"
          validation: required
        - $formkit: select
          name: tableWidthMode
          id: tableWidthMode
          label: 表格宽度模式
          value: "proportional"
          options:
            - value: "proportional"
              label: 保持比例
            - value: "fill"
              label: 宽度铺满
          help: 保持比例：按原始列宽渲染，超宽时可在微信里横向滚动（推荐）；宽度铺满：列宽压缩进屏宽、不横向滚动
        - $formkit: select
          name: columnsLayoutStyle
          id: columnsLayoutStyle
          label: 分栏卡片版式
          value: "table"
          options:
            - value: "table"
              label: 表格
            - value: "stacked"
              label: 独占一行
          help: 表格：各列并排（推荐）；独占一行：每栏各占一行
        - $formkit: select
          name: galleryLayoutStyle
          id: galleryLayoutStyle
          label: 画廊版式
          value: "table"
          options:
            - value: "table"
              label: 表格
            - value: "stacked"
              label: 独占一行
          help: 表格：多图并排（推荐）；独占一行：每张图各占一行
