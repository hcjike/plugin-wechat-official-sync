apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-wechat-official-sync-settings
spec:
  forms:
    - group: wechat
      label: 微信公众号
      formSchema:
        - $formkit: text
          name: appId
          label: AppID
          help: 公众平台「设置与开发 - 基本配置」中的开发者 ID
          validation: required
        - $formkit: secret
          name: appSecretName
          label: AppSecret
          descriptionPreset: 微信公众号开发者密码
          requiredKeys:
            - key: appSecret
              help: 公众平台「设置与开发 - 基本配置」中的开发者密码（AppSecret）
          help: AppSecret 由 Halo Secret 统一托管，此处仅保存 Secret 名称，不以明文写入插件配置
        - $formkit: text
          name: baseUrl
          label: 代理接口地址
          help: 选填。留空则直连微信官方接口；需经反向代理转发时填写代理地址，配置说明详见 README「接口地址与反向代理」。
          value: ""
        - $formkit: text
          name: author
          label: 默认作者
          help: 同步到公众号时展示的作者名，留空则使用文章作者
          value: ""
        - $formkit: select
          name: commentMode
          id: commentMode
          label: 留言设置
          value: "close"
          options:
            - value: "close"
              label: 关闭留言
            - value: "all"
              label: 所有人可留言
            - value: "fans"
              label: 已关注的人可留言
          help: 同步生成的草稿的留言权限；「已关注 7 天及以上」仅支持在公众号后台设置
        - $formkit: textarea
          name: imageHostAllowlist
          label: 图片下载白名单
          help: 选填。默认拒绝下载内网/环回等受限地址的图片（防 SSRF）。内网部署导致同步失败时，可按行添加信任目标放行：域名、*.子域、IP 或 CIDR（如 192.168.0.0/16）。留空最安全。
          value: ""
    - group: beautify
      label: 正文美化
      formSchema:
        - $formkit: color
          name: textColor
          label: 正文文字颜色
          help: 段落、列表、表格正文的文字颜色
          value: "#3f3f3f"
          validation: required
        - $formkit: color
          name: linkColor
          label: 链接颜色
          help: 正文中超链接的文字颜色
          value: "#576b95"
          validation: required
        - $formkit: color
          name: inlineCodeColor
          label: 行内代码颜色
          help: 行内 code 的文字颜色（默认对齐微信图文经典风格）
          value: "#d14"
          validation: required
        - $formkit: color
          name: inlineCodeBgColor
          label: 行内代码底色
          help: 行内 code 的背景色
          value: "#f2f3f5"
          validation: required
        - $formkit: switch
          onValue: true
          offValue: false
          name: blockquoteBorderEnabled
          id: blockquoteBorderEnabled
          label: 引用块显示边框
          value: true
          help: 关闭后引用块不显示左侧强调边框（边框颜色见下方「引用块边框颜色」）
        - $formkit: color
          name: themeColor
          label: 引用块边框颜色
          help: 引用块左侧强调边框的颜色
          value: "#07c160"
          validation: required
        - $formkit: color
          name: blockquoteBgColor
          label: 引用块背景色
          help: 引用块（含块内文字区域）的背景颜色
          value: "#f7f7f7"
          validation: required
        - $formkit: switch
          onValue: true
          offValue: false
          name: headingBorderEnabled
          id: headingBorderEnabled
          label: 标题显示边框
          value: false
          help: 开启后 H2–H6 标题显示左侧强调边框（H1 居中不加边框），边框颜色由下方各级「标题边框颜色」决定
        - $formkit: color
          name: h1Color
          label: 一级标题颜色
          help: H1 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h2Color
          label: 二级标题颜色
          help: H2 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h2BorderColor
          label: 二级标题边框颜色
          help: H2 标题左侧强调边框的颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h3Color
          label: 三级标题颜色
          help: H3 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h3BorderColor
          label: 三级标题边框颜色
          help: H3 标题左侧强调边框的颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h4Color
          label: 四级标题颜色
          help: H4 标题文字颜色
          value: "#222222"
          validation: required
        - $formkit: color
          name: h4BorderColor
          label: 四级标题边框颜色
          help: H4 标题左侧强调边框的颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h5Color
          label: 五级标题颜色
          help: H5 标题文字颜色
          value: "#333333"
          validation: required
        - $formkit: color
          name: h5BorderColor
          label: 五级标题边框颜色
          help: H5 标题左侧强调边框的颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
        - $formkit: color
          name: h6Color
          label: 六级标题颜色
          help: H6 标题文字颜色
          value: "#888888"
          validation: required
        - $formkit: color
          name: h6BorderColor
          label: 六级标题边框颜色
          help: H6 标题左侧强调边框的颜色（需开启「标题显示边框」）
          value: "#07c160"
          validation: required
